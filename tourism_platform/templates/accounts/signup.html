{% extends "base.html" %}
{% block title %}إنشاء حساب{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3 text-center">إنشاء حساب جديد</h4>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}

          <button class="btn btn-success w-100">إنشاء الحساب</button>
        </form>

        <div class="text-center mt-3">
          <a href="/accounts/login/">لديك حساب؟ تسجيل الدخول</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
